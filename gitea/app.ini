; Gitea Konfiguration für ZeugDB (Development)
; Wird nach /data/gitea/conf/app.ini gemountet

[app]
APP_NAME = ZeugDB Git Server
RUN_MODE = prod
RUN_USER = git
HTTP_PORT = 3000
ROOT_URL = http://localhost:8929/
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false

[server]
SSH_PORT = 22
OFFLINE_MODE = true

[database]
DB_TYPE = sqlite3
HOST = localhost
NAME = gitea
PATH = /data/gitea/gitea.db
SSL_MODE = disable

[repository]
ROOT = /data/gitea/repositories

[security]
INSTALL_LOCK = true
INTERNAL_TOKEN = _eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eycJiOiJnaXRlYS1pbmNyZWF0ZWQiLCJpc3MiOiJnaXRlYS1zdWl0ZSIsImV4cCI6MzU3NTE0OTMwMzB9.dT0xwkoI1KrcNnAlBcNzu1pXfNmISjCSbr9HaDWjkcY
PASSWORD_HASH_ALGO = argon2

[service]
REGISTER_EMAIL_CONFIRM = false
ENABLE_CAPTCHA = false

[log]
MODE = console
LEVEL = info

[oauth2]
ENABLED = true

