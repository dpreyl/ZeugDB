# Local-development CORS proxy for browser-based Git and Git LFS.
# Production deployments should apply equivalent CORS rules at their own
# reverse proxy, restricted to the app's trusted origin.
server {
  listen 80;
  client_max_body_size 0;

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, Transfer-Encoding, X-Requested-With" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }

    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $http_host;
    # Keep HTTPS information from the Caddy front proxy; for direct HTTP
    # development requests an empty value is omitted and Gitea sees HTTP.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://gitserver:3000;
  }
}
