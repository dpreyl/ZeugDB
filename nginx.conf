server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker muss ohne SPA-Fallback als Datei ausgeliefert werden
    location = /service-worker.js {
        try_files /service-worker.js =404;
    }
}
