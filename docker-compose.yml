# ZeugDB – Docker Compose (Entwicklungsumgebung)
#
# Services:
#   app       – SvelteKit PWA (Dev Server mit Hot-Reloading)
#   gitserver – Gitea als lokaler Git-Server mit LFS-Unterstützung
#
# Ports:
#   3000      – PWA Development Server (Vite HMR)
#   8929      – Gitea Web UI + HTTP API
#   8930      – Gitea SSH (optional)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules  # Host node_modules vermeiden (Cache-Volume)
    environment:
      - NODE_ENV=development
      - GIT_SERVER_URL=http://gitserver:3000
    depends_on:
      - gitserver

  gitserver:
    image: gitea/gitea:latest
    ports:
      - "8929:3000"
      - "8930:22"
    volumes:
      - gitea_data:/data
      - gitea_logs:/log
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__app__APP_NAME=ZeugDB Git Server
      - GITEA__server__ROOT_URL=http://localhost:8929/
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__REGISTER_EMAIL_CONFIRM=false
      - GITEA__service__ENABLE_CAPTCHA=false
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__log__MODE=console
      - GITEA__log__LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  gitea-init:
    image: gitea/gitea:latest
    volumes:
      - gitea_data:/data
      - ./gitea/init.sh:/init.sh
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      - GITEA_ADMIN_USERNAME=admin
      - GITEA_ADMIN_PASSWORD=admin123
      - GITEA_ADMIN_EMAIL=admin@zeugdb.local
      - GITEA_REPO_NAME=ZeugDB
    depends_on:
      gitserver:
        condition: service_healthy
    restart: "no"

volumes:
  gitea_data:
  gitea_logs:
