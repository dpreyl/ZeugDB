# ZeugDB – Docker Compose
#
# =========================
# Entwicklung (lokaler Dev-Server + Git-Server)
# =========================
# Services:
#   app       – SvelteKit PWA (Dev Server mit Hot-Reloading)
#   gitserver – Gitea als lokaler Git-Server mit LFS-Unterstützung
#   gitea-init – Einmaliges Setup des Gitea-Admin-Accounts + Repos
#
# Ports (Entwicklung):
#   3000      – PWA Development Server (Vite HMR)
#   8929      – Gitea Web UI + HTTP API
#   8930      – Gitea SSH (optional)
#
# Start:  docker compose up
#
# =========================
# Produktion (statische PWA via nginx)
# =========================
# Der production-Service baut die App als statische Site und serviert
# sie via nginx. Er läuft auf dem Server, nicht auf den Client-Geräten.
# Die Clients greifen per Browser zu (z.B. http://server-ip:8080).
# Der Service Worker übernimmt Offline-Caching — kein lokaler Server
# auf den Clients nötig.
#
# Start:  docker compose up -d production
# Port:   8080 (Host) → 80 (nginx)
# Hinweis: In Produktion ggf. Port 80 statt 8080 nutzen und einen
#          Reverse Proxy (traefik, caddy) vor nginx schalten.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules  # Host node_modules vermeiden (Cache-Volume)
    environment:
      - NODE_ENV=development
      - GIT_SERVER_URL=http://gitserver:3000
    depends_on:
      - gitserver

  gitserver:
    image: gitea/gitea:latest
    ports:
      - "8929:3000"
      - "8930:22"
    volumes:
      - gitea_data:/data
      - gitea_logs:/log
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__app__APP_NAME=ZeugDB Git Server
      - GITEA__server__ROOT_URL=http://localhost:8929/
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__REGISTER_EMAIL_CONFIRM=false
      - GITEA__service__ENABLE_CAPTCHA=false
      - GITEA__server__LFS_START_SERVER=true
      # Gitea smart HTTP uses this repository-specific CORS setting.
      - GITEA__repository__ACCESS_CONTROL_ALLOW_ORIGIN=${GITEA_CORS_ALLOW_DOMAIN:-*}
      - GITEA__log__MODE=console
      - GITEA__log__LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  gitea-init:
    image: gitea/gitea:latest
    volumes:
      - gitea_data:/data
      - ./gitea/init.sh:/init.sh
      - ./gitea/repo-template:/repo-template:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      - GITEA_ADMIN_USERNAME=admin
      - GITEA_ADMIN_PASSWORD=admin123
      - GITEA_ADMIN_EMAIL=admin@zeugdb.local
      - GITEA_REPO_NAME=ZeugDB
      - GITEA_TEMPLATE_DIR=/repo-template
    depends_on:
      gitserver:
        condition: service_healthy
    restart: "no"

  production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  gitea_data:
  gitea_logs:
